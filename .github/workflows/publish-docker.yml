name: Publish Docker image to GHCR

# Manual-only. Trigger it from the Actions tab ("Run workflow") to build the
# Docker image and push it to the GitHub Container Registry
# (ghcr.io/<owner>/gigwa-mcp). Not tied to releases.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, without v (for example 1.9.0)"
        type: string
        required: true

permissions:
  contents: read
  packages: write  # required to push to GHCR

env:
  # github.repository_owner is already lowercase; GHCR image names must be lowercase.
  IMAGE: ghcr.io/${{ github.repository_owner }}/gigwa-mcp

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.tag }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must use x.y.z format" >&2
            exit 1
          }
          project_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "$project_version" == "${{ inputs.tag }}" ]] || {
            echo "input tag ${{ inputs.tag }} does not match pyproject.toml version $project_version" >&2
            exit 1
          }

      - name: Set up QEMU  # emulation for cross-building arm64 on amd64 runners
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify version and latest resolve to the pushed image
        shell: bash
        run: |
          set -euo pipefail
          version_digest=$(docker buildx imagetools inspect "${IMAGE}:${{ inputs.tag }}" --format '{{.Manifest.Digest}}')
          latest_digest=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')
          [[ "$version_digest" == "${{ steps.build.outputs.digest }}" ]]
          [[ "$latest_digest" == "$version_digest" ]]
