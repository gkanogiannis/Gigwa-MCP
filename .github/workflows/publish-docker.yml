name: Publish Docker image to GHCR

# Manual-only. Trigger it from the Actions tab ("Run workflow") to build the
# Docker image and push it to the GitHub Container Registry
# (ghcr.io/<owner>/gigwa-mcp). Not tied to releases.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. latest, 1.5.0)"
        type: string
        default: latest

permissions:
  contents: read
  packages: write  # required to push to GHCR

env:
  # github.repository_owner is already lowercase; GHCR image names must be lowercase.
  IMAGE: ghcr.io/${{ github.repository_owner }}/gigwa-mcp

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU  # emulation for cross-building arm64 on amd64 runners
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
